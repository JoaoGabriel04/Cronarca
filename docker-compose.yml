# Ambiente de desenvolvimento do Cronarca. Use pelo Makefile (`make up`).
name: cronarca

x-node-healthcheck: &node-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    init: true
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_TEST: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      # Origem pública do site: usada no CSRF e no retorno do OAuth.
      APP_URL: http://localhost:${FRONTEND_PORT:-3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - backend_game_core_node_modules:/app/packages/game-core/node_modules
      - backend_app_node_modules:/app/apps/backend/node_modules
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    init: true
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_INTERNAL_URL: http://backend:4000
      # Depuração do mapa (?semente=, "Nova semente"). Em produção é sempre desligada.
      NEXT_PUBLIC_DEBUG_MAPA: ${NEXT_PUBLIC_DEBUG_MAPA:-1}
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_game_core_node_modules:/app/packages/game-core/node_modules
      - frontend_app_node_modules:/app/apps/frontend/node_modules
      - frontend_next:/app/apps/frontend/.next
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 90s

  # Só em desenvolvimento: caixa de e-mail local.
  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
  backend_node_modules:
  backend_game_core_node_modules:
  backend_app_node_modules:
  frontend_node_modules:
  frontend_game_core_node_modules:
  frontend_app_node_modules:
  frontend_next:
